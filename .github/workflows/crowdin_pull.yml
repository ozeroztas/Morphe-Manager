name: Crowdin pull and merge

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  configuration:
    name: Check Crowdin configuration
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [[ -n "$CROWDIN_PROJECT_ID" && -n "$CROWDIN_PERSONAL_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Crowdin sync skipped" >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure both repository Actions secrets, `CROWDIN_PROJECT_ID` and `CROWDIN_PERSONAL_TOKEN`, to enable translation syncing.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # A placeholder a translator got wrong crashes the app in that language, so it stops the merge
      - name: Check translation placeholders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew :app:testDebugUnitTest --tests "app.morphe.manager.TranslationFormatTest"

      # Step 3: Checkout dev branch to prepare for merging
      - name: Checkout dev branch for merge
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      # Step 4: Fetch the latest crowdin branch (already checked)
      - name: Fetch crowdin branch
        run: git fetch origin crowdin

      # Step 5: Squash merge crowdin into dev
      - name: Squash merge crowdin into dev
        run: |
          git config --local user.name "Crowdin Bot"
          git config --local user.email "support+bot@crowdin.com"
          git merge --squash origin/crowdin
          git commit --allow-empty -m "chore: Update translations from Crowdin"
          git push origin dev
