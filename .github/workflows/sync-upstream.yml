name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync Morphe Manager
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --tags --force
          git reset --hard origin/main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/MorpheApp/morphe-manager.git
          else
            git remote add upstream https://github.com/MorpheApp/morphe-manager.git
          fi

          git fetch upstream main --tags --force

          git merge upstream/main --no-edit -X theirs

          git checkout ORIG_HEAD -- \
            .github/workflows/sync-upstream.yml \
            .github/workflows/crowdin_pull.yml
          git add .github/workflows/sync-upstream.yml .github/workflows/crowdin_pull.yml

          if ! git diff --cached --quiet; then
            git commit --no-edit -m "Sync upstream"
            git push origin main
          fi

          git push origin --tags
