name: Sync upstream

on:
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync Morphe Manager
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --tags --force
          git reset --hard origin/main
          local_head=$(git rev-parse HEAD)

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/MorpheApp/morphe-manager.git
          else
            git remote add upstream https://github.com/MorpheApp/morphe-manager.git
          fi
          git fetch upstream main --tags --force
          upstream_head=$(git rev-parse upstream/main)
          git merge "$upstream_head" --no-edit -X theirs

          # Preserve this repository's sync workflow and missing-secret guards.
          git restore --source="$local_head" --staged --worktree -- \
            .github/workflows/sync-upstream.yml \
            .github/workflows/crowdin_pull.yml \
            .github/workflows/release.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve local workflow configuration"
          fi

          # Merge may already have committed everything. Always push main.
          git push origin HEAD:main
          git push origin --tags --force

          # Verify the published branch actually includes the fetched upstream.
          git fetch origin main
          git merge-base --is-ancestor "$upstream_head" origin/main
          {
            echo "### Upstream sync verified"
            echo "Published upstream commit: $upstream_head"
            echo "Local sync, Crowdin and Release workflow configuration preserved."
          } >> "$GITHUB_STEP_SUMMARY"
