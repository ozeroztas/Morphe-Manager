name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync Morphe Manager
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --tags --force
          git reset --hard origin/main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/MorpheApp/morphe-manager.git
          else
            git remote add upstream https://github.com/MorpheApp/morphe-manager.git
          fi

          git fetch upstream main --tags --force
          git merge upstream/main --no-edit -X theirs

          # Keep only this fork-specific manual sync workflow.
          git checkout ORIG_HEAD -- .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml

          if ! git diff --cached --quiet; then
            git commit --no-edit -m "Sync upstream"
            if [[ -n "${SYNC_TOKEN:-}" ]]; then
              git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            else
              git push origin main
            fi
          fi

          echo "Pushing upstream tags..."

          if [[ -n "${SYNC_TOKEN:-}" ]]; then
            git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "SYNC_TOKEN is not configured; using GITHUB_TOKEN. If upstream changes workflow files, GitHub may reject the push."
          fi

          git push origin --tags --force
          echo "Main and upstream tags synchronized successfully (sync-upstream.yml preserved)."
